owner: ParedesYTecho
repo: Werewolf-Status

sites:
  - name: Bot conectado a Discord
    url: https://werewolfbot-c8v6.onrender.com/health
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"connected": true'
  - name: Servidor de Render
    url: https://werewolfbot-c8v6.onrender.com
  - name: Web pública
    url: https://werewolfdashboard.vercel.app/
  - name: Base de datos
    url: https://werewolfdashboard.vercel.app/api/estado
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"key":"db","name":"Base de datos","state":"ok"'

status-website:
  baseUrl: /Werewolf-Status
  logoUrl: https://raw.githubusercontent.com/ParedesYTecho/Werewolf-Status/master/assets/logo.png
  name: Werewolf · Estado del servicio
  introTitle: "**Werewolf**: estado del servicio"
  introMessage: Comprobaciones automáticas del bot de Discord, el servidor, la web y la base de datos. Esta página es independiente de la web y del servidor del bot. El historial empieza el día en que se activó.
  navbar:
    - title: Estado
      href: /
    - title: Web
      href: https://werewolfdashboard.vercel.app/

commitMessages:
  commitAuthorName: Upptime Bot
  commitAuthorEmail: 73812536+upptime-bot@users.noreply.github.com
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true
secrets: []

i18n:
  up: Operativo
  down: Caído
  degraded: Degradado
  url: Dirección
  status: Estado
  history: Historial
  ms: ms
  responseTime: Tiempo de respuesta
  responseTimeDay: Tiempo de respuesta (24 h)
  responseTimeWeek: Tiempo de respuesta (7 días)
  responseTimeMonth: Tiempo de respuesta (30 días)
  responseTimeYear: Tiempo de respuesta (1 año)
  uptime: Disponibilidad
  uptimeDay: Disponibilidad (24 h)
  uptimeWeek: Disponibilidad (7 días)
  uptimeMonth: Disponibilidad (30 días)
  uptimeYear: Disponibilidad (1 año)
  liveStatus: Estado actual
  allSystemsOperational: Todos los servicios operativos
  degradedPerformance: Rendimiento degradado
  completeOutage: Caída total
  partialOutage: Caída parcial
